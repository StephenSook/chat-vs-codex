name: Judge smoke
on:
  schedule:
    - cron: "19 15 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Check the hosted deployment or a committed preview
        type: choice
        required: true
        default: hosted
        options: [hosted, preview]
permissions:
  contents: read
concurrency:
  group: judge-smoke
  cancel-in-progress: true
jobs:
  judge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/judge
      - run: pnpm judge:smoke
        env:
          CI: "true"
          JUDGE_SMOKE_HOSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'preview' && '0' || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-smoke-evidence
          path: .local/judge-smoke/
          include-hidden-files: true
          retention-days: 7
